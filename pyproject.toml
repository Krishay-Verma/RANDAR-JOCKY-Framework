[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "randar-jocky"
version = "3.0.0"
description = "RANDAR forensic platform and JOCKY forensic toolchain"
requires-python = ">=3.10"

[project.scripts]
jocky = "jocky.cli:main"

[tool.setuptools.packages.find]
include = ["jocky*"]
